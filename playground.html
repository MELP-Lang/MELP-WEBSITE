<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MELP Playground — STAGE10</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0d1117; color: #c9d1d9; }
header { background: #161b22; padding: 20px 24px; text-align: center; border-bottom: 1px solid #30363d; }
header h1 { font-size: 22px; color: #e94560; }
header p { font-size: 13px; color: #8b949e; margin-top: 4px; }
.container { max-width: 800px; margin: 0 auto; padding: 20px; }
.demo-nav { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; align-items: center; }
.demo-nav button { padding: 8px 16px; border: 1px solid #30363d; border-radius: 6px; background: #161b22; color: #c9d1d9; cursor: pointer; font-size: 13px; transition: all 0.15s; }
.demo-nav button:hover { border-color: #e94560; }
.demo-nav button.active { background: #e94560; border-color: #e94560; color: #fff; }
#btn-run { background: #238636 !important; border-color: #238636 !important; font-weight: bold; margin-left: auto; }
#btn-run:hover { background: #2ea043 !important; }
#btn-run:disabled { opacity: 0.6; cursor: wait; }
.panel { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 16px; margin-bottom: 16px; }
.panel h3 { font-size: 14px; color: #8b949e; margin-bottom: 8px; }
pre { background: #0d1117; border-radius: 6px; padding: 12px; overflow-x: auto; font-size: 13px; line-height: 1.5; }
code { font-family: 'JetBrains Mono', 'Fira Code', monospace; }
.kw { color: #ff7b72; }
.str { color: #a5d6ff; }
.cm { color: #8b949e; font-style: italic; }
.output { color: #7ee787; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 16px; }
.stat { background: #0d1117; border: 1px solid #30363d; border-radius: 6px; padding: 12px; text-align: center; }
.stat .val { font-size: 28px; font-weight: bold; color: #e94560; }
.stat .lbl { font-size: 11px; color: #8b949e; margin-top: 4px; }
#console { min-height: 80px; max-height: 300px; overflow-y: auto; font-size: 12px; }
</style>
</head>
<body>
<header>
  <h1>🦊 MELP Playground</h1>
  <p>STAGE10 — Scope tabanlı GUI, GC'siz, otomatik ömür yönetimi | WASM < 1KB</p>
</header>

<div class="container">
  <div class="stats">
    <div class="stat"><div class="val" id="wasm-size">0.8</div><div class="lbl">WASM (KB)</div></div>
    <div class="stat"><div class="val">141</div><div class="lbl">LLVM IR Satır</div></div>
    <div class="stat"><div class="val">0</div><div class="lbl">Cleanup Kodu</div></div>
    <div class="stat"><div class="val">0ms</div><div class="lbl">GC Pause</div></div>
  </div>

  <div class="demo-nav">
    <button class="active" data-demo="tabclose">🗂️ Tab Kapat</button>
    <button data-demo="counter">🔢 Sayaç</button>
    <button data-demo="form">📝 Form</button>
    <button data-demo="toast">🔔 Toast</button>
    <button id="btn-run">▶ Çalıştır</button>
  </div>

  <div class="panel">
    <h3>📄 MELP Kaynak Kodu</h3>
    <pre><code id="source-code"></code></pre>
  </div>

  <div class="panel">
    <h3>🖥️ Çıktı</h3>
    <pre id="console"></pre>
  </div>
</div>

<script>
const demos = {
  tabclose: {
    source: `-- MELP'in farkı: Tab kapanınca 4 kaynak OTOMATİK temizlenir
-- cleanup(), dispose(), destroy(), removeListener() YOK.

scope TabApp
    scope "Window Scope"
        scope TabScope("Veri Sekmesi")
            scope TimerScope
                string name = "refresh_timer"
            end scope
            scope RequestScope
                string url = "https://api.example.com/data"
            end scope
            scope StateScope
                string data = ""
            end scope
            scope ListenerScope
                string key = "Ctrl+S"
            end scope
            scope ButtonScope("Kapat")
                string button_text = "Sekmeyi Kapat"
            end scope
        end scope
    end scope
end scope

numeric function main()
    return 0
end function`,
    highlight: 'Tab kapanınca → 4 kaynak OTOMATİK temizlenir. Tek satır cleanup kodu YOK.'
  },
  counter: {
    source: `scope Counter Scope
    numeric count = 0
    scope Button Scope("+")
        onClick -> channel increment
    end scope
    scope Button Scope("-")
        onClick -> channel decrement
    end scope
    scope Label Scope("0")
    end scope

    increment.receive() -> { count = count + 1 }
    decrement.receive() -> { count = count - 1 }
end scope

numeric function main()
    return 0
end function`,
    highlight: 'State değişimi: onClick → channel → count++. useState/Redux YOK.'
  },
  form: {
    source: `scope Form Scope
    scope TextInput Scope("email")
        onChange -> channel email_changed
    end scope
    scope TextInput Scope("password")
        onChange -> channel password_changed
    end scope
    scope Button Scope("Giriş")
    end scope
end scope

numeric function main()
    return 0
end function`,
    highlight: 'Sibling koordinasyonu: channel ile, doğrudan referans YOK.'
  },
  toast: {
    source: `scope Toast Scope
    life = 3s
    scope Label Scope("İşlem tamamlandı!")
    end scope
end scope

numeric function main()
    return 0
end function`,
    highlight: '3 saniye sonra scope OTOMATİK kapanır. Widget + timer → temiz.'
  }
};

let currentDemo = 'tabclose';
let wasmCache = {};

function formatSource(src) {
  return src
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/--.*/g, m => `<span class="cm">${m}</span>`)
    .replace(/(".*?")/g, m => `<span class="str">${m}</span>`)
    .replace(/\b(scope|end scope|numeric|string|function|return|if|then|else|loop|external|life|onClick|onChange|channel|receive)\b/g, m => `<span class="kw">${m}</span>`);
}

async function runDemo() {
  const btn = document.getElementById('btn-run');
  const consoleEl = document.getElementById('console');
  btn.textContent = '⏳ Çalışıyor...';
  btn.disabled = true;
  
  try {
    let wasmData;
    if (wasmCache[currentDemo]) {
      wasmData = wasmCache[currentDemo];
    } else {
      const resp = await fetch(`wasm/demo_${currentDemo}.wasm`);
      if (!resp.ok) throw new Error(`${currentDemo}.wasm yüklenemedi`);
      const bytes = await resp.arrayBuffer();
      wasmData = { bytes, size: bytes.byteLength };
      wasmCache[currentDemo] = wasmData;
    }
    
    const { instance } = await WebAssembly.instantiate(wasmData.bytes, {
      env: {
        memory: new WebAssembly.Memory({ initial: 2, maximum: 16 }),
        puts: (ptr) => {
          const mem = new Uint8Array(instance.exports.memory.buffer);
          let str = '';
          for (let i = ptr; mem[i] !== 0; i++) str += String.fromCharCode(mem[i]);
          consoleEl.innerHTML += `<span class="output">${str}</span>`;
        },
        exit: () => {}
      }
    });

    const t0 = performance.now();
    let result = 0;
    if (instance.exports.melp_main) {
      result = instance.exports.melp_main();
    }
    const t1 = performance.now();
    
    consoleEl.innerHTML += `<span class="output">exit: ${result} ✅</span>\n`;
    consoleEl.innerHTML += `<span class="cm">⏱ ${(t1-t0).toFixed(1)}ms | WASM: ${wasmData.size}B | IR: 141 satır | cleanup: 0 satır</span>\n`;
    
    btn.textContent = '▶ Çalıştır';
    btn.style.background = '#238636';
  } catch (err) {
    consoleEl.innerHTML += `<span style="color:#ff7b72">❌ ${err.message}</span>\n`;
    btn.textContent = '▶ Tekrar Dene';
    btn.style.background = '#da3633';
  }
  btn.disabled = false;
}

function showDemo(demoId) {
  currentDemo = demoId;
  const demo = demos[demoId];
  document.getElementById('source-code').innerHTML = formatSource(demo.source);
  
  document.querySelectorAll('.demo-nav button:not(#btn-run)').forEach(b => b.classList.remove('active'));
  document.querySelector(`[data-demo="${demoId}"]`).classList.add('active');
  
  const consoleEl = document.getElementById('console');
  consoleEl.innerHTML = `<span class="cm">// ${demo.highlight}</span>\n`;
  consoleEl.innerHTML += `<span class="cm">// ▶ Çalıştır'a basın</span>\n\n`;
  
  document.getElementById('btn-run').textContent = '▶ Çalıştır';
  document.getElementById('btn-run').style.background = '#238636';
}

// Buton handler'ları
document.querySelectorAll('.demo-nav button[data-demo]').forEach(btn => {
  btn.addEventListener('click', () => showDemo(btn.dataset.demo));
});
document.getElementById('btn-run').addEventListener('click', runDemo);

// Başlangıç
showDemo('tabclose');
</script>
</body>
</html>
